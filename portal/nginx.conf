# limite de conexões simultâneas por IP (protege a banda contra download em loop)
limit_conn_zone $binary_remote_addr zone=porip:10m;

# rede do provedor (saída do NOC/VPN): só ela vê e baixa a área técnica
geo $rede_noc {
    default      0;
    187.86.63.2  1;
}
# página inicial: a rede do NOC recebe a versão com o quadro "Área técnica"
map $rede_noc $pagina_inicial {
    1        /index-noc.html;
    default  /index.html;
}

server {
    listen 80 ssl;
    http2 on;
    server_name suporteopc.duckdns.org;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_tickets off;

    # HTTP puro na porta HTTPS (link antigo): redireciona para o endereco novo
    error_page 497 =301 https://suporteopc.duckdns.org:8088$request_uri;

    # acesso pelo IP ou por outro nome (robôs procurando câmeras etc.): fecha a conexão sem resposta
    if ($host != "suporteopc.duckdns.org") { return 444; }

    # cabeçalhos de segurança (repetidos nos location que usam add_header)
    # CSP: script inline liberado só pelo hash; se mudar o <script> da página, recalcular
    set $csp "default-src 'none'; script-src 'sha256-xC92TZpwFSBFXEGnETIi53U/b2MtS7W4YuOETlU+p6Y='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    root /usr/share/nginx/html;
    index index.html;
    limit_conn porip 4;

    location = / {
        # rede do NOC recebe a página com o quadro "Área técnica" (gerar-pagina-noc.sh)
        add_header Cache-Control "no-cache, private" always;
        add_header Vary "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        try_files $pagina_inicial =404;
    }

    location = /baixar {
        alias /usr/share/nginx/html/files/suporte.exe;
        default_type application/octet-stream;
        limit_conn porip 2;
        add_header Content-Disposition 'attachment; filename="opc-remoto.exe"' always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # cliente Linux (Ubuntu/Debian): .deb com nome curto, o mesmo do tutorial da página
    location = /baixar-linux {
        alias /usr/share/nginx/html/files/opc-remoto-linux.deb;
        default_type application/vnd.debian.binary-package;
        limit_conn porip 2;
        add_header Content-Disposition 'attachment; filename="opc-remoto.deb"' always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # fonte Lato local (antes vinha do Google Fonts)
    location ^~ /fonts/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # exe só pelo /baixar
    location /files/ { return 404; }

    # página da rede do NOC: só pelo "/" (nunca pelo nome direto)
    location = /index-noc.html { return 404; }

    # área técnica: só a rede do provedor; fora dela responde 404 (nem revela que existe)
    location ^~ /tecnico/ {
        if ($rede_noc = 0) { return 404; }
        autoindex off;
        default_type application/octet-stream;
        limit_conn porip 2;
        add_header Content-Disposition 'attachment' always;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
